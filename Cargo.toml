[workspace]
resolver = "3"
members = ["crates/bough-mem", "crates/bough-core", "crates/bough-text", "crates/bough-metal", "crates/bough-damage-lab", "crates/bough", "comparisons/bough-heavy", "comparisons/bough-scenes", "comparisons/bough-vlist", "comparisons/bough-zgui", "comparisons/bough-text-bench"]
# Vendored forks (vendor/README.md): path dependencies, not members (their tests and dev-dependencies stay upstream's).
exclude = ["vendor"]

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"

[profile.release]
debug = 1
lto = "thin"

# What ships, and what every comparison measures (matches zgx's `dist`).
[profile.dist]
inherits = "release"
debug = 0
lto = "fat"
codegen-units = 1
