[workspace]
resolver = "3"
members = ["crates/bough-mem", "crates/bough-core", "crates/bough-text", "crates/bough-metal", "crates/bough-damage-lab", "crates/bough", "comparisons/bough-heavy", "comparisons/bough-scenes", "comparisons/bough-vlist", "comparisons/bough-suite", "comparisons/bough-zgui", "comparisons/bough-text-bench", "comparisons/bough-app-mail-dash", "comparisons/bough-app-sketch-code", "comparisons/bough-widgets"]

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"

[profile.release]
debug = 1
lto = "thin"

# What ships, and what every comparison measures (matches zgx's `dist`).
[profile.dist]
inherits = "release"
debug = 0
lto = "fat"
codegen-units = 1
