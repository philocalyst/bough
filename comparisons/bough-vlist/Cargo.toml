[package]
name = "bough-vlist"
version = "0.0.0"
edition.workspace = true
license.workspace = true
description = "zgx's vlist scene (100k wrapped chat rows, measured virtual list) and vscroll-variable micro_bench on bough + cephal"

[dependencies]
bough = { path = "../../crates/bough" }
bough-text = { path = "../../crates/bough-text" }
bough-mem = { path = "../../crates/bough-mem" }
zgx-workload = { git = "https://github.com/zeronsh/zgx", rev = "06debe9df86dbcb0a82d6074d01f98ace98a65b3" }
libc = "0.2"
cephal = { path = "../../vendor/cephal", default-features = false, features = ["flex", "block"] }

# the Metal presenter (macOS) for the tools that drive it directly
[target.'cfg(target_os = "macos")'.dependencies]
bough-metal = { path = "../../crates/bough-metal" }

[[bin]]
name = "vlist_workload"
path = "src/bin/vlist_workload.rs"
[[bin]]
name = "vlist_headless"
path = "src/bin/vlist_headless.rs"
[[bin]]
name = "micro_bench_vlist"
path = "src/bin/micro_bench.rs"
[[bin]]
name = "vlist_shot"
path = "src/bin/vlist_shot.rs"

[dev-dependencies]
cephal = { path = "../../vendor/cephal", default-features = false, features = ["flex", "block"] }
[[bin]]
name = "layout_bench"
path = "src/bin/layout_bench.rs"
[[bin]]
name = "cephal_raw"
path = "src/bin/cephal_raw.rs"
[[bin]]
name = "text_bench"
path = "src/bin/text_bench.rs"
