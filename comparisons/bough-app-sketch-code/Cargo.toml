[package]
name = "bough-app-sketch-code"
version = "0.0.0"
edition.workspace = true
license.workspace = true
description = "zgx's Sketch and Code example apps (crates/zgx-script/examples/{sketch,code_editor}) as native bough views, with zgx's apps_bench interactions and pixel gates"

[dependencies]
bough = { path = "../../crates/bough" }
bough-core = { path = "../../crates/bough-core" }
bough-text = { path = "../../crates/bough-text" }
zgx-workload = { git = "https://github.com/zeronsh/zgx", rev = "06debe9df86dbcb0a82d6074d01f98ace98a65b3" }

# the Metal presenter (macOS) for the tools that drive it directly
[target.'cfg(target_os = "macos")'.dependencies]
bough-metal = { path = "../../crates/bough-metal" }

[[bin]]
name = "apps_bench_sketch_code"
path = "src/bin/apps_bench.rs"
