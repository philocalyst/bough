[package]
name = "bough-suite"
version = "0.0.0"
edition.workspace = true
license.workspace = true
description = "zgx's scripts/perf/suite.py scenes (script, gpu and core suites) and crates/zgx examples, ported natively onto bough"

[dependencies]
bough = { path = "../../crates/bough" }
bough-core = { path = "../../crates/bough-core" }
bough-text = { path = "../../crates/bough-text" }
zgx-workload = { git = "https://github.com/zeronsh/zgx", rev = "06debe9df86dbcb0a82d6074d01f98ace98a65b3" }

# the Metal presenter (macOS) for the tools that drive it directly
[target.'cfg(target_os = "macos")'.dependencies]
bough-metal = { path = "../../crates/bough-metal" }

[dev-dependencies]
rustybuzz = "0.20"
ttf-parser = { version = "0.25", default-features = false, features = ["std"] }
