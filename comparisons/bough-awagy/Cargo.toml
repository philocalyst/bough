[package]
name = "bough-awagy"
version = "0.0.0"
edition.workspace = true
license.workspace = true
description = "areweactuallyguiyet.mespin.me's scroll and dashboard workloads, written on bough's design surface (bough::prelude only)"

[[bin]]
name = "bough-awagy"
path = "src/main.rs"

# The pacing lane's in-process probe (docs/lanes/pacing): both workloads through `Application::run`, driven by
# events posted to this process's own queue, with the frame log on.
[[bin]]
name = "pace_probe"
path = "src/bin/pace_probe.rs"
required-features = ["framelog"]

[features]
# As the site's apps: exactly one of the two workloads.
default = ["scroll"]
scroll = []
dashboard = []
framelog = ["bough/framelog"]

[dependencies]
bough = { path = "../../crates/bough" }

