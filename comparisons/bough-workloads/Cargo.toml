[package]
name = "bough-workloads"
version = "0.0.0"
edition.workspace = true
license.workspace = true
description = "The standing workloads (round 7, bench lane): an IDE, a dashboard of 200 charts, a design canvas, a chat with media, a spreadsheet of 100,000 cells; cold start, steady interaction, resize sweeps, fan-out hover, theme switches and transitions"

[dependencies]
bough = { path = "../../crates/bough" }
bough-mem = { path = "../../crates/bough-mem" }
# the font every scene draws with (embedded; the same bytes on every host)
zgx-workload = { git = "https://github.com/zeronsh/zgx", rev = "06debe9df86dbcb0a82d6074d01f98ace98a65b3" }
# synthetic images for the chat's media (encoded once at build of the model)
png = "0.17"
libc = "0.2"
# layout lane probe (`lay_probe`, feature `cephal-stats`): cephal's query counters
cephal = { path = "../../vendor/cephal", default-features = false, features = ["flex", "block", "grid"], optional = true }
serde_json = { version = "1", optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
# phys_footprint (process counters); the only macOS-only call in the crate is in src/sys.rs
bough-metal = { path = "../../crates/bough-metal" }

[features]
default = ["sheet", "ide", "dash", "canvas", "chat"]
# One feature per scene, so a scene can be built alone (`--no-default-features --features ide`) while another
# is being edited.
sheet = []
ide = []
dash = []
canvas = []
chat = []
# hotpath's phase profile of the turn (bough's own measure sites) printed at exit: instrumented, never a
# release number (docs/lanes/bench/MEASUREMENT.md).
hotpath = ["bough/hotpath"]
hotpath-alloc = ["bough/hotpath-alloc"]
# cephal's query counters in `lay_probe` (instrumented: attribution only)
cephal-stats = ["bough/cephal-stats", "dep:cephal", "cephal/stats"]
# `lay_probe` writes the scene's layout trees for cephal's replay example (`DUMP=path`)
dump = ["dep:cephal", "cephal/serde", "dep:serde_json"]

[[bin]]
name = "workload"
path = "src/bin/workload.rs"

[[bin]]
# the same driver with bough_mem::count::Counting as the global allocator: allocation counts per step
name = "workload_alloc"
path = "src/bin/workload_alloc.rs"

[[bin]]
# layout lane: where a scene's layout instructions go (mount, resize steps)
name = "lay_probe"
path = "src/bin/lay_probe.rs"
