[package]
name = "bough-zgui"
version = "0.0.0"
edition.workspace = true
license.workspace = true
description = "zgui's interaction benchmarks (cargo xtask perf scenarios and probes) on bough: the documents, the event sequences, the measured spans"

[dependencies]
bough = { path = "../../crates/bough" }
bough-core = { path = "../../crates/bough-core" }
bough-metal = { path = "../../crates/bough-metal" }
zgx-workload = { path = "/Users/mileswirht/projects/_ref/zgx/comparisons/workload" }
libc = "0.2"

[[bin]]
name = "zgui_scenario"
path = "src/bin/zgui_scenario.rs"
[[bin]]
name = "label_churn"
path = "src/bin/label_churn.rs"
[[bin]]
name = "resize_slope"
path = "src/bin/resize_slope.rs"
[[bin]]
name = "drag_probe"
path = "src/bin/drag_probe.rs"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["block2"] }
objc2-app-kit = { version = "0.3", features = ["objc2-quartz-core", "objc2-core-foundation", "block2"] }
block2 = "0.6"

[dev-dependencies]
bough-text = { path = "../../crates/bough-text" }
rustybuzz = "0.20"
