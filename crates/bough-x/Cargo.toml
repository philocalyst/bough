[package]
name = "bough-x"
version = "0.0.0"
edition.workspace = true
license.workspace = true
description = "Round 8: a UI as a typed dataflow. Expressions as types with the stage inferred, finite-difference damage over exposed pages, archetype columns in 64-record pages, description by continuation"

[dependencies]
bough-expr = { path = "../bough-expr" }
bough-lay = { path = "../bough-lay" }
# Prepared faces, shaped lines as two-word runs, the span kernel (text lane). No dependencies of its own.
bough-face = { path = "../bough-face" }

[dev-dependencies]
bough-mem = { path = "../bough-mem" }

[features]
# Mutants the pixel gates (tests/sheet.rs) must fail with:
# the derivative forgets every other record of a page
mutant_delta = []
# a list ignores the relation's journal
mutant_journal = []
# a moved record damages only where it is now; a record in motion only where it will rest
mutant_moves = []
# a frame with records in motion damages nothing
mutant_sweep = []
# a line of text whose colour reads the block is never found changed (tests/text.rs must fail)
mutant_line = []
# reflection takes a list record's ring slot for its row (tests/reflect.rs must fail)
mutant_reflect = []
