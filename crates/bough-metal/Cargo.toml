[package]
name = "bough-metal"
version = "0.0.0"
edition.workspace = true
license.workspace = true
description = "Direct-Metal presenter prototype: uber-shader, buffer-age repair, IOSurface ring"

# The presenter is Metal and AppKit: on any other target this crate is empty (lib.rs), so the workspace builds there.
[target.'cfg(target_os = "macos")'.dependencies]
bough-frame = { path = "../bough-frame" }
bough-sys = { path = "../bough-sys" }
objc2 = "0.6"
objc2-foundation = { version = "0.3" }
objc2-metal = { version = "0.3", features = ["objc2-io-surface", "dispatch2", "block2", "objc2-core-foundation"] }
objc2-quartz-core = { version = "0.3", features = ["objc2-metal", "objc2-core-foundation", "block2"] }
objc2-app-kit = { version = "0.3", features = ["objc2-quartz-core", "objc2-core-foundation", "block2"] }
objc2-io-surface = { version = "0.3", features = ["objc2-core-foundation"] }
objc2-core-foundation = { version = "0.3" }
block2 = "0.6"
libc = "0.2"
dispatch2 = "0.3"

[features]
# Gate sabotage (lane memory, round 6): column views never grow past their first size; the capacity test
# (crates/bough/tests/capacity.rs) must fail with it.
sabotage_views = []
# Gate mutants of the row certificates (shader.metal `FCert`): each must make a scroll pixel gate fail.
# The scroll copy skips a certified row without consulting the destination's own certificate.
mutant_cert_skip = []
# A row the copy moved keeps the certificate of what the destination held before.
mutant_cert_stale = []
# The tile pass certifies a band from one of its pixels.
mutant_cert_tile = []

[[example]]
# not "bench": bough-text has an example of that name (cargo output collision in one target dir)
name = "metal_bench"
path = "examples/bench.rs"
[[example]]
name = "correctness"
[[example]]
name = "floor"
[[example]]
name = "probe"
[[example]]
name = "latency"
[[example]]
name = "publish"
[[example]]
name = "vclip_test"
[[example]]
name = "gpumodes"
[[example]]
name = "lab"
[[example]]
name = "opcost"
[[example]]
name = "runs_check"
[[example]]
name = "wake"
[[example]]
name = "fprobe"
[[example]]
name = "iosurf_alias"
