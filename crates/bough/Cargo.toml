[package]
name = "bough"
version = "0.0.0"
edition.workspace = true
license.workspace = true
description = "bough: the public facade (Signal, View, typed builders, turns) over bough-core, bough-text and the Metal backend"

[dependencies]
bough-core = { path = "../bough-core", features = ["tile32"] }
bough-text = { path = "../bough-text" }
bough-metal = { path = "../bough-metal" }
rustybuzz = "0.20"
ttf-parser = { version = "0.25", default-features = false, features = ["std"] }
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["block2"] }
objc2-metal = { version = "0.3", features = ["objc2-io-surface", "dispatch2", "block2", "objc2-core-foundation"] }
objc2-quartz-core = { version = "0.3", features = ["objc2-metal", "objc2-core-foundation", "block2"] }
objc2-app-kit = { version = "0.3", features = ["objc2-quartz-core", "objc2-core-foundation", "block2"] }
objc2-io-surface = { version = "0.3", features = ["objc2-core-foundation"] }
objc2-core-foundation = { version = "0.3" }
block2 = "0.6"
dispatch2 = "0.3"
