[package]
name = "bough-gpu"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "bough's GPU path on vendored wgpu-hal (Metal), shaders in wgsl-rs compiled to a metallib at build time"

[dependencies]
wgsl-rs = { git = "https://github.com/schell/wgsl-rs", rev = "b2de16a1b81e67d76bc265c296184f882864badb", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
wgpu-hal = { version = "29.0.4", default-features = false, features = ["metal"] }
wgpu-types = { version = "29.0.4", default-features = false, features = ["std"] }
objc2 = "0.6"
objc2-foundation = { version = "0.3" }
objc2-metal = { version = "0.3", features = ["objc2-io-surface", "dispatch2", "block2", "objc2-core-foundation"] }
objc2-io-surface = { version = "0.3", features = ["objc2-core-foundation"] }
objc2-core-foundation = { version = "0.3" }
objc2-quartz-core = { version = "0.3", features = ["objc2-metal", "objc2-core-foundation", "block2"] }
dispatch2 = "0.3"
bough-metal = { path = "../bough-metal" }

[build-dependencies]
wgsl-rs = { git = "https://github.com/schell/wgsl-rs", rev = "b2de16a1b81e67d76bc265c296184f882864badb", default-features = false }
naga = { version = "29.0.4", features = ["wgsl-in", "msl-out"] }

[dev-dependencies]
# the `#[wgsl]` macro's generated `__validate_wgsl` tests (naga validation of every module); tests only
wgsl-rs = { git = "https://github.com/schell/wgsl-rs", rev = "b2de16a1b81e67d76bc265c296184f882864badb", default-features = false, features = ["validation"] }
