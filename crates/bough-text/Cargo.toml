[package]
name = "bough-text"
version = "0.0.0"
edition.workspace = true
license.workspace = true

[dependencies]
bough-mem = { path = "../bough-mem" }
ttf-parser = { version = "0.25", default-features = false, features = ["std", "opentype-layout", "variable-fonts"] }
swash = "0.2"
# Vendored parley (vendor/README.md): bough's text path; the grafts live in vendor/parley/src/bough/.
parley = { path = "../../vendor/parley", default-features = false, features = ["std", "system"] }

[dev-dependencies]
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-metal = "0.3"
rustybuzz = "0.20"
libc = "0.2"
zgx-workload = { package = "zgx-workload", path = "/Users/mileswirht/projects/_ref/zgx/comparisons/workload" }
cosmic-text = { package = "zgx-cosmic-text", path = "/Users/mileswirht/projects/_ref/zgx/vendor/cosmic-text", default-features = false, features = ["std", "swash", "shape-run-cache"] }
ttf-parser = "0.25"
# Unmodified upstream parley from crates.io: the reference every graft is gated against.
parley_upstream = { package = "parley", version = "=0.11.1", default-features = false, features = ["std", "system"] }
# ICU's segmenters, the oracle for graft 3b's boundary machines (tests/breaks.rs).
icu_segmenter = { version = "2.4", default-features = false, features = ["compiled_data"] }

