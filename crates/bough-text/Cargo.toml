[package]
name = "bough-text"
version = "0.0.0"
edition.workspace = true
license.workspace = true

[dependencies]
bough-mem = { path = "../bough-mem" }
# The prepared-face image this crate bakes (stage::bake) and the number arithmetic it shares with the kernels.
bough-face = { path = "../bough-face" }
ttf-parser = { version = "0.25", default-features = false, features = ["std", "opentype-layout", "variable-fonts"] }
swash = "0.2"
# Vendored parley (vendor/README.md): bough's text path; the grafts live in vendor/parley/src/bough/. Without
# fontique's `system` backend (CoreText on macOS, fontconfig on Linux, DirectWrite on Windows): bough-text takes
# font bytes and never asks the OS for fonts, so text is the same pure-Rust code on every platform (round 7,
# platform lane). The tests' twin layouts still use the system collection (dev-dependencies below).
parley = { path = "../../vendor/parley", default-features = false, features = ["std"] }

[dev-dependencies]
parley = { path = "../../vendor/parley", default-features = false, features = ["std", "system"] }
# Linux instruction counter for the examples (perf_event_open; macOS uses proc_pid_rusage directly).
bough-damage-lab = { path = "../bough-damage-lab" }
rustybuzz = "0.20"
libc = "0.2"
zgx-workload = { package = "zgx-workload", git = "https://github.com/zeronsh/zgx", rev = "06debe9df86dbcb0a82d6074d01f98ace98a65b3" }
cosmic-text = { package = "zgx-cosmic-text", git = "https://github.com/zeronsh/zgx", rev = "06debe9df86dbcb0a82d6074d01f98ace98a65b3", default-features = false, features = ["std", "swash", "shape-run-cache"] }
ttf-parser = "0.25"
# Unmodified upstream parley from crates.io: the reference every graft is gated against.
parley_upstream = { package = "parley", version = "=0.11.1", default-features = false, features = ["std", "system"] }
# ICU's segmenters, the oracle for graft 3b's boundary machines (tests/breaks.rs).
icu_segmenter = { version = "2.4", default-features = false, features = ["compiled_data"] }

# examples/gpu_shape.rs (Attempt 3, shaping on Metal) is macOS only.
[target.'cfg(target_os = "macos")'.dev-dependencies]
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-metal = "0.3"
