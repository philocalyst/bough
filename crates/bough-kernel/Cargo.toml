[package]
name = "bough-kernel"
version = "0.0.0"
edition.workspace = true
license.workspace = true
description = "bough's one raster kernel: integer shade/blend/store written once in wgsl-rs Rust, run natively by the CPU executors and through naga's MSL by the GPU"

[dependencies]
wgsl-rs = { git = "https://github.com/schell/wgsl-rs", rev = "b2de16a1b81e67d76bc265c296184f882864badb", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3" }
objc2-metal = { version = "0.3" }

# The Vulkan executor (src/vulkan.rs, round 7 platform lane): the vendored wgpu-hal's Vulkan backend; ash for the
# host-memory import of the window's buffer (VK_EXT_external_memory_host), the version wgpu-hal uses.
[target.'cfg(target_os = "linux")'.dependencies]
wgpu-hal = { version = "29.0.4", default-features = false, features = ["vulkan"] }
wgpu-types = { version = "29.0.4", default-features = false, features = ["std"] }
ash = "0.38"

[build-dependencies]
wgsl-rs = { git = "https://github.com/schell/wgsl-rs", rev = "b2de16a1b81e67d76bc265c296184f882864badb", default-features = false }
naga = { version = "29.0.4", features = ["wgsl-in", "msl-out", "spv-out"] }

[dev-dependencies]
# the `#[wgsl]` macro's generated `__validate_wgsl` tests (naga validation of each module); tests only
wgsl-rs = { git = "https://github.com/schell/wgsl-rs", rev = "b2de16a1b81e67d76bc265c296184f882864badb", default-features = false, features = ["validation"] }

[features]
# Mutants for the exactness gate (tests/exact.rs must fail with each):
# the CPU executor's core rectangle is one pixel too wide
mutant_core = []
# the occlusion cut accepts a cover that is not opaque
mutant_cut = []
# row replication treats a rounded box's corner rows as flat
mutant_flat = []
